<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Field Score</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍃</text></svg>">
<style>

  :root{
    --paper: #fff;
/*    --paper-card: #d9d6c4;*/
    --ink: #2b2e23;
/*    --ink-soft: #565a49;*/
    --green: #33d16f;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0;
    height:100%;
    width:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    overscroll-behavior:none;
    touch-action:none;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .wrap{
    height:100%;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 8vh 20px 6vh;
  }

  header{
    text-align:center;
    max-width: 480px;
    margin-bottom: 5vh;
  }

  h1{
    font-optical-sizing: auto;
    font-weight: 300;
    font-size: clamp(1.6rem, 5vw, 2.0rem);
    margin: 0;
    letter-spacing: -0.01em;
  }

  /* --- the card --- */

  .stage{
    width: 100%;
    max-width: 70vw;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom: 140px;
  }

  @media (max-width: 600px){
    .wrap{ padding-top: 4vh; }
    header{ margin-bottom: 2vh; }
    .stage{ max-width: 100%; }
  }

  .card{
    position:relative;
    width:100%;
    padding: 40px 4px 40px;
    min-height: 220px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .instruction-text{
    font-weight: 300;
    font-size: clamp(2rem, 8.5vw, 3.4rem);
    color: var(--ink);
    text-align: center;
    line-height: 1.15;
  }

  .instruction-text .word{
    display:inline-block;
    opacity: 0;
    filter: blur(2px);
    transform: translateY(4px);
    animation: settle 0.5s ease forwards;
  }

  @keyframes settle{
    to{ opacity:1; filter: blur(0); transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    .instruction-text .word{
      animation: none;
      opacity: 1;
      filter: none;
      transform: none;
    }
  }

  /* --- generated path (mobile + location only) --- */

  .path-stage{
    display:none;
    width: min(58vw, 220px);
    aspect-ratio: 1;
    margin: 18px auto 0;
  }

  .path-stage svg{ width:100%; height:100%; display:block; overflow:visible; }

  .trail-segment{
    fill:none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.85;
    vector-effect: non-scaling-stroke;
  }

  .path-origin{
    fill: none;
    stroke: var(--ink);
    stroke-width: 1;
    opacity: 0.4;
    vector-effect: non-scaling-stroke;
  }

  .user-dot{
    fill: var(--green);
    display:none;
    transition: cx 0.3s linear, cy 0.3s linear;
  }

  .placeholder{
    font-size: clamp(2rem, 8.5vw, 3.4rem);
    color: var(--ink-soft);
    display: block;
    text-align: center;
  }

  /* --- controls ---
     Fixed to the bottom of the viewport so the arrow sits in the same
     spot regardless of how long the current score runs. */

  .controls{
    position: fixed;
    left: 50%;
    bottom: 6vh;
    transform: translateX(-50%);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 14px;
  }

  button.walk-btn{
    width: 84px;
    height: 84px;
    border: none;
    background: transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0;
    cursor: pointer;
    transition: transform 0.15s ease;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    outline: none;
    -webkit-touch-callout: none;
    user-select: none;
  }

  button.walk-btn svg{ width: 48px; height: 48px; display:block; }

  #arrowIcon{
    transition: transform 0.35s ease-out;
    transform-origin: center;
  }

  button.walk-btn:active{ transform: scale(0.92); }

  .tally{
    font-size: clamp(1.6rem, 5vw, 2.0rem);
    font-weight: 300;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    min-height: 14px;
    margin-top: 8px;
  }

</style>
</head>
<body>

<div class="wrap">

  <header>
    <h1>Field Score</h1>
    <div class="tally" id="tally"></div>
  </header>

  <div class="stage">
    <div class="card" id="card">
      <div class="instruction-text" id="instructionText">
        <span class="placeholder">Begin walk when ready.</span>
      </div>

      <div class="path-stage" id="pathStage">
        <svg id="pathSvg" viewBox="-2.5 -2.5 5 5">
          <circle class="path-origin" id="walkStartMarker" cx="0" cy="0" r="0.12" style="display:none"/>
          <g id="trailGroup"></g>
          <circle class="user-dot" id="userDot" cx="0" cy="0" r="0.14"/>
        </svg>
      </div>
    </div>

    <div class="controls">
      <button class="walk-btn" id="genButton" aria-label="Begin walk">
        <svg id="arrowIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12h15M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>


</div>

<script>
/* =========================================================================
   1. WORD BANKS
   Kept separate from sentence structure so the vocabulary can grow on its
   own without touching how instructions are assembled.
   ========================================================================= */

const seekVerbs = [
  "Walk until", "Keep walking until", "Slow your pace until",
  "Wander until", "Follow the path until", "Walk slowly until",
  "Take your time until", "Keep going until",
];

// things that can be physically picked up, carried, or traded
const collectibleElements = [
  "a leaf", "a twig", "a small stone", "a seed pod",
  "a piece of bark", "a fallen leaf", "a blade of grass", "a pinecone",
  "a dry husk", "a surprising object", "a scrap of moss", "a flower petal",
  "a fallen fruit", "a shell of some kind",
];

// things that should only be looked at, not taken
const observeOnlyElements = [
  "a spiderweb", "a shadow pattern on the ground",
  "a puddle reflecting something above it", "a patch of moss",
  "a cluster of insects at work", "a root breaking through the ground",
  "a cloud that reminds you of something", "a knot in a tree trunk",
  "a beam of light through the leaves", "a trail left by an animal",
  "a crack in the bark", "a nest tucked somewhere unlikely", "a breeze",
  "a ripple on standing water", "two branches touching",
];

const qualifiers = [
  "shaped like something familiar",
  "in a color you haven't noticed today",
  "older than everything around it",
  "out of place here",
  "catching the light",
  "unlike anything else nearby",
  "with an odd texture",
  "bent or broken in an interesting way",
  "half-hidden by something else",
  "no bigger than a coin",
  "that took a moment to spot",
  "someone else already noticed",
  "that doesn't belong to this season",
  "still slightly damp",
  "worn down by something",
  "growing somewhere it shouldn't",
];

const collectibleActions = [
  "Pick it up and study it.",
  "Photograph it from three angles.",
  "Carry it, then leave it somewhere new.",
  "Weigh it in your palm.",
  "Leave it somewhere it'll surprise someone.",
  "Turn it over before deciding.",
  "Give it a name.",
];

const observeActions = [
  "Photograph it as you found it.",
  "Trace its outline in the air.",
  "Describe it out loud to no one.",
  "Sketch it in three lines.",
  "Watch it for a minute, still.",
  "Guess how it got here.",
  "Find its best angle.",
  "Give it a name.",
];

const quantityTargets = [
  { n: 3, thing: "twigs that fit in your palm", action: "line them up by size." },
  { n: 5, thing: "different shades of green", action: "name each one out loud." },
  { n: 4, thing: "sounds no person made", action: "guess what made the last one." },
  { n: 2, thing: "leaves that are almost identical", action: "find the one difference." },
  { n: 3, thing: "things smaller than a coin", action: "decide which is oldest." },
  { n: 6, thing: "textures you can feel without looking", action: "keep your eyes closed for the last one." },
  { n: 4, thing: "different kinds of bark", action: "rank them roughest to smoothest." },
  { n: 3, thing: "signs an animal passed through", action: "guess which one is most recent." },
  { n: 5, thing: "things smaller than your hand", action: "arrange them from lightest to heaviest." },
];

const closingPrompts = [
  "Notice what you almost missed.",
  "Remember why you chose it.",
  "Keep it in mind for the walk.",
];

// smell-focused elements and actions, used by the dedicated scent template
const scentElements = [
  "damp earth", "something fresh", "something sweet", "rain on stone",
  "crushed leaves", "flowers nearby", "scent from somewhere",
  "wet bark", "something rotting", "fresh-cut grass", "dry dust",
  "something green",
];

const scentActions = [
  "Follow it as far as you can.",
  "Try to name its source.",
  "Breathe it in twice more.",
  "See if it fades or grows.",
  "Find where it's strongest.",
  "Hold your breath, then smell it again.",
];

// full sentence options for the stillness template, kept separate from the
// find/collect banks since the sentence shape here is fixed either way
const stillnessPrompts = [
  (n) => `Stop walking. Wait until you spot ${n} things moving on their own.`,
  (n) => `Stand still until you catch ${n} small movements around you.`,
  (n) => `Pause here. Watch until you notice ${n} things shift or sway without you touching them.`,
  (n) => `Stop and hold still until you can point to ${n} things in motion nearby.`,
];

/* =========================================================================
   2. TEMPLATES
   Each template is a small function that returns { category, text }.
   Category is kept on the object for future use (e.g. filtering or
   weighting) even though the UI no longer displays it.
   ========================================================================= */

function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function maybe(prob){ return Math.random() < prob; }

// Picks without repeats until a pool is exhausted, then reshuffles by
// clearing that pool's used-set. Keeps qualifiers/actions/elements from
// clustering on the same few entries within one walk.
const usedByPool = new WeakMap();
function pickUnique(arr){
  let used = usedByPool.get(arr);
  if (!used){ used = new Set(); usedByPool.set(arr, used); }
  if (used.size >= arr.length) used.clear();
  let choice;
  do { choice = pick(arr); } while (used.has(choice));
  used.add(choice);
  return choice;
}

function templateFind(){
  const useCollectible = maybe(0.55);
  const element = pickUnique(useCollectible ? collectibleElements : observeOnlyElements);
  const action = pickUnique(useCollectible ? collectibleActions : observeActions);
  const qualifier = pickUnique(qualifiers);
  const closer = maybe(0.1) ? " " + pickUnique(closingPrompts) : "";
  return {
    category: "find",
    text: `${pick(seekVerbs)} you see ${element} ${qualifier}. ${action}${closer}`
  };
}

function templateScent(){
  const scent = pickUnique(scentElements);
  const action = pickUnique(scentActions);
  return {
    category: "scent",
    text: `${pick(seekVerbs)} you smell ${scent}. ${action}`
  };
}

function templateQuantity(){
  const q = pickUnique(quantityTargets);
  const action = q.action.charAt(0).toLowerCase() + q.action.slice(1);
  return {
    category: "collect",
    text: `${pick(seekVerbs)} you collect ${q.n} ${q.thing}. Then ${action}`
  };
}

function templateStillness(){
  const n = 2 + Math.floor(Math.random() * 4);
  const phrasing = pickUnique(stillnessPrompts);
  return {
    category: "stillness",
    text: phrasing(n)
  };
}

// find-type is weighted slightly heavier — it's the most repeatable core loop
const templates = [templateFind, templateFind, templateQuantity, templateStillness, templateScent];

/* =========================================================================
   3. GENERATION + NOVELTY TRACKING
   Nothing here is pre-written — every call recombines the banks above.
   The used-set just prevents the same exact sentence twice in one session.
   ========================================================================= */

const usedThisWalk = new Set();

function generateInstruction(){
  let attempt, tries = 0;
  do {
    attempt = pick(templates)();
    tries++;
  } while (usedThisWalk.has(attempt.text) && tries < 25);
  usedThisWalk.add(attempt.text);
  return attempt;
}

/* =========================================================================
   4. RENDER
   ========================================================================= */

const instructionEl = document.getElementById('instructionText');
const button = document.getElementById('genButton');
const tallyEl = document.getElementById('tally');
const arrowIcon = document.getElementById('arrowIcon');

let count = 0;

/* --- heading (mobile only) ---
   No separate compass dial — the same chevron that doubles as the
   "next instruction" button also acts as a compass needle, always
   rotating to point true north as you turn. If there's no heading
   sensor it just sits as a plain forward chevron. */

const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const hasOrientation = typeof DeviceOrientationEvent !== 'undefined';

let headingRequested = false;
let currentHeading = null; // degrees, 0 = north, clockwise

function handleOrientation(e){
  let heading = null;
  if (typeof e.webkitCompassHeading === 'number'){
    heading = e.webkitCompassHeading; // iOS: true heading, 0 = north
  } else if (e.absolute && e.alpha != null){
    heading = 360 - e.alpha; // best-effort compass heading elsewhere
  }
  if (heading == null || isNaN(heading)) return;

  currentHeading = heading;
  updateCompassArrow();
}

function requestHeading(){
  if (headingRequested || !isTouch || !hasOrientation) return;
  headingRequested = true;

  const attach = () => {
    window.addEventListener('deviceorientationabsolute', handleOrientation, true);
    window.addEventListener('deviceorientation', handleOrientation, true);
  };

  if (typeof DeviceOrientationEvent.requestPermission === 'function'){
    // iOS: must be called directly from a user gesture, which this is.
    DeviceOrientationEvent.requestPermission().then(state => {
      if (state === 'granted') attach();
    }).catch(() => {});
  } else {
    attach();
  }
}

function updateCompassArrow(){
  if (currentHeading == null){
    arrowIcon.style.transform = '';
    return;
  }
  const relative = (360 - currentHeading) % 360; // bearing to north relative to facing direction
  const rotation = relative - 90; // arrow's rest pose points right, i.e. "90° relative"
  arrowIcon.style.transform = `rotate(${rotation}deg)`;
}

/* --- real-position trail (mobile + location only) ---
   No more generated shape to trace — this line is simply everywhere
   the walker has actually been since tapping "begin walk". It keeps
   growing across instructions instead of resetting each time; each
   instruction's stretch draws in its own color so it's clear where
   one ended and the next began. The little map auto-zooms out to
   keep the whole trail-so-far in view. */

const pathStage = document.getElementById('pathStage');
const pathSvg = document.getElementById('pathSvg');
const trailGroup = document.getElementById('trailGroup');
const walkStartMarker = document.getElementById('walkStartMarker');
const userDot = document.getElementById('userDot');

const hasGeolocation = 'geolocation' in navigator;
const TRAIL_MIN_POINT_SPACING_M = 0.12; // ignore sub-noise-floor jitter between recorded points

const SEGMENT_COLORS = ['#33d16f', '#2b8fd1', '#d19a33', '#9a4fd1', '#d1495f', '#33b3a6'];

let locationRequested = false;
let currentPos = null;      // { lat, lon } — smoothed, current position
let sessionOrigin = null;   // { lat, lon } — fixed reference point for the whole walk's local coords
let walkStarted = false;
let trailSegments = [];     // array of arrays of { x, y } points, one array per instruction
let segmentEls = [];        // matching <path> element for each entry in trailSegments

let viewState = null;       // { cx, cy, size } — smoothly-animated viewBox, in local meters
const VIEW_MIN_SIZE = 5;    // don't zoom in tighter than the original 5x5m default
const VIEW_PADDING = 1.4;   // headroom so the trail isn't pressed against the edge

function polylinePath(points){
  if (points.length < 2) return '';
  return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(3)} ${p.y.toFixed(3)}`).join(' ');
}

function gpsToLocal(lat, lon, originLat, originLon){
  const R = 6378137;
  const dLat = (lat - originLat) * Math.PI / 180;
  const dLon = (lon - originLon) * Math.PI / 180;
  const north = dLat * R;
  const east = dLon * R * Math.cos(originLat * Math.PI / 180);
  return { x: east, y: -north }; // SVG y grows downward; flip so north is up
}

function distanceMeters(a, b){
  const R = 6378137;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLon = (b.lon - a.lon) * Math.PI / 180;
  const north = dLat * R;
  const east = dLon * R * Math.cos(a.lat * Math.PI / 180);
  return Math.hypot(north, east);
}

function toLocal(pos){
  return gpsToLocal(pos.lat, pos.lon, sessionOrigin.lat, sessionOrigin.lon);
}

/* --- GPS smoothing ---
   Raw phone GPS wobbles by several meters second to second even while
   perfectly still — rotating the phone alone can change which satellites
   it has a clean line to and shift the fix, with nobody moving at all.
   A deadband ignores fixes that are within the noise floor outright, a
   low weight cap means even a "real" fix only nudges the smoothed dot a
   little, and movement per update is capped to what a walking person
   could plausibly cover. */

const GPS_MAX_ACCURACY_M = 50;     // fixes worse than this are ignored (after the first)
const GPS_DEADBAND_M = 0.4;        // fixes closer than this to the current dot are treated as noise, not movement
const GPS_IDEAL_ACCURACY_M = 3;    // accuracy at/under this gets the most responsiveness
const GPS_SMOOTH_MIN_W = 0.03;
const GPS_SMOOTH_MAX_W = 0.2;
const GPS_MAX_WALK_MPS = 1.2;      // walking pace, not sprinting
const GPS_STILL_SLACK_M = 0.35;    // small cushion per update so real steps aren't clamped away

let smoothedAccuracy = null;
let lastFixTime = null;

function smoothPosition(raw, accuracy, now){
  const acc = (typeof accuracy === 'number' && accuracy > 0) ? accuracy : 15;

  if (!currentPos){
    smoothedAccuracy = acc;
    lastFixTime = now;
    return { lat: raw.lat, lon: raw.lon };
  }

  // deadband: if this fix sits within the noise floor of where we already
  // think we are, it's not a real move — ignore it rather than nudge the dot.
  const rawMoved = distanceMeters(currentPos, raw);
  const noiseFloor = Math.max(GPS_DEADBAND_M, acc * 0.3);
  if (rawMoved < noiseFloor){
    smoothedAccuracy = smoothedAccuracy + (acc - smoothedAccuracy) * 0.15;
    lastFixTime = now;
    return currentPos;
  }

  const w = Math.max(GPS_SMOOTH_MIN_W, Math.min(GPS_SMOOTH_MAX_W, GPS_IDEAL_ACCURACY_M / acc));

  let candidate = {
    lat: currentPos.lat + (raw.lat - currentPos.lat) * w,
    lon: currentPos.lon + (raw.lon - currentPos.lon) * w,
  };

  // clamp this update's movement to what a walking person could plausibly cover
  const dt = lastFixTime ? Math.max(0.2, (now - lastFixTime) / 1000) : 1;
  const maxStep = GPS_MAX_WALK_MPS * dt + GPS_STILL_SLACK_M;
  const moved = distanceMeters(currentPos, candidate);
  if (moved > maxStep){
    const t = maxStep / moved;
    candidate = {
      lat: currentPos.lat + (candidate.lat - currentPos.lat) * t,
      lon: currentPos.lon + (candidate.lon - currentPos.lon) * t,
    };
  }

  smoothedAccuracy = smoothedAccuracy + (acc - smoothedAccuracy) * w;
  lastFixTime = now;
  return candidate;
}

function lastRecordedPoint(){
  for (let i = trailSegments.length - 1; i >= 0; i--){
    const seg = trailSegments[i];
    if (seg.length) return seg[seg.length - 1];
  }
  return null;
}

function beginNewSegment(){
  const seg = [];
  const prev = lastRecordedPoint();
  if (prev) seg.push({ x: prev.x, y: prev.y }); // shared vertex keeps the line continuous

  trailSegments.push(seg);

  const el = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  el.setAttribute('class', 'trail-segment');
  el.style.stroke = SEGMENT_COLORS[(trailSegments.length - 1) % SEGMENT_COLORS.length];
  trailGroup.appendChild(el);
  segmentEls.push(el);

  if (seg.length) el.setAttribute('d', polylinePath(seg));
}

function recordPoint(local){
  if (!trailSegments.length) return;
  const seg = trailSegments[trailSegments.length - 1];
  const last = seg.length ? seg[seg.length - 1] : null;

  if (last && Math.hypot(local.x - last.x, local.y - last.y) < TRAIL_MIN_POINT_SPACING_M) return;

  seg.push({ x: local.x, y: local.y });
  segmentEls[segmentEls.length - 1].setAttribute('d', polylinePath(seg));
}

function updateViewBox(local){
  const points = [];
  for (const seg of trailSegments) for (const p of seg) points.push(p);
  if (local) points.push(local);
  if (!points.length) return;

  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of points){
    if (p.x < minX) minX = p.x;
    if (p.x > maxX) maxX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.y > maxY) maxY = p.y;
  }

  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const span = Math.max(maxX - minX, maxY - minY, VIEW_MIN_SIZE / VIEW_PADDING);
  const size = span * VIEW_PADDING;

  if (!viewState){
    viewState = { cx, cy, size };
  } else {
    // ease toward the new bounds instead of snapping, so zooming out reads as a gentle pull-back
    const w = 0.25;
    viewState = {
      cx: viewState.cx + (cx - viewState.cx) * w,
      cy: viewState.cy + (cy - viewState.cy) * w,
      size: viewState.size + (size - viewState.size) * w,
    };
  }

  const half = viewState.size / 2;
  pathSvg.setAttribute(
    'viewBox',
    `${(viewState.cx - half).toFixed(3)} ${(viewState.cy - half).toFixed(3)} ${viewState.size.toFixed(3)} ${viewState.size.toFixed(3)}`
  );
}

function updateTrail(){
  if (!walkStarted || !currentPos) return;

  if (!sessionOrigin){
    sessionOrigin = { lat: currentPos.lat, lon: currentPos.lon };
    walkStartMarker.style.display = 'block';
  }

  const local = toLocal(currentPos);
  recordPoint(local);

  userDot.setAttribute('cx', local.x.toFixed(3));
  userDot.setAttribute('cy', local.y.toFixed(3));
  userDot.style.display = 'block';

  updateViewBox(local);
}

function handlePosition(pos){
  const acc = pos.coords.accuracy;
  const isFirstFix = !currentPos;

  // A coarse, later fix isn't worth showing (e.g. a momentary satellite
  // dropout) — but always accept the very first fix no matter how rough,
  // so the trail actually has somewhere to start from instead of never
  // beginning at all while waiting for a fix that's "accurate enough".
  if (!isFirstFix && typeof acc === 'number' && acc > GPS_MAX_ACCURACY_M) return;

  currentPos = smoothPosition(
    { lat: pos.coords.latitude, lon: pos.coords.longitude },
    acc,
    Date.now()
  );

  updateTrail();
}

function enableLocation(){
  if (locationRequested || !hasGeolocation || !isTouch) return;
  locationRequested = true;
  navigator.geolocation.watchPosition(handlePosition, () => {}, {
    enableHighAccuracy: true,
    maximumAge: 1000,
    timeout: 15000,
  });
}

function renderInstruction({ text }){
  const words = text.split(' ');
  instructionEl.innerHTML = words
    .map((w, i) => `<span class="word" style="animation-delay:${i * 0.028}s">${w}</span>`)
    .join(' ');

  count += 1;
  tallyEl.textContent = String(count).padStart(2, '0');
  button.setAttribute('aria-label', 'Next instruction');

  if (hasGeolocation && isTouch){
    walkStarted = true;
    pathStage.style.display = 'block';
    beginNewSegment();
    if (currentPos) updateTrail(); // in case a fix already arrived before this tap
  }
}

button.addEventListener('click', () => {
  requestHeading();
  enableLocation();
  renderInstruction(generateInstruction());
});

// Start acquiring GPS as early as possible (page load, not first tap) so a
// fix is already available by the time someone starts walking, instead of
// the dot lagging a few steps behind while the first fix comes in.
// (Heading needs an explicit user gesture on iOS, so that one still waits
// for the button click above.)
enableLocation();
</script>
